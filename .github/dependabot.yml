version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      qiskit:
        patterns: ["qiskit*"]
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "hypothesis", "pre-commit"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
