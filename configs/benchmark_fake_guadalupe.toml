# The four combinations on a noisy simulation of ibmq_guadalupe (Aer + the fake backend's
# calibration data). Hyperparameters differ from benchmark.toml on purpose:
#   * ADAM's finite-difference step must be large compared with shot noise (fd_eps = 0.1);
#   * SPSA's perturbation likewise (0.1), with a larger step so 50 iterations get somewhere;
#   * budgets are reduced because a noisy evaluation costs ~2.5 s (density-matrix simulation,
#     independent of the shot count): SPSA 50 iterations (101 evaluations), ADAM 30 (391 for
#     RVB, 91 for HVA). Shots are therefore generous, and the final energy is re-measured once
#     with final_shots.
# Energies are sampled, so shot noise and readout error are real. At the exact ground-state
# parameters the noisy energy is about -12.7 (readout error alone: -16.4; gate and T1/T2 error
# alone: -14.0). No optimiser can beat that floor; it is the target for error mitigation.
name = "fake_guadalupe"
seed = 42
x0_scale = 0.3
record_params = false

[lattice]
site_order = "hamiltonian_cycle"

[backend]
kind = "aer_noisy"
name = "FakeGuadalupeV2"
shots = 4096
final_shots = 16384
optimization_level = 3
initial_layout = [1, 2, 3, 5, 8, 11, 14, 13, 12, 10, 7, 4]

[[combos]]
ansatz = { type = "rvb" }
optimizer = { type = "spsa", maxiter = 50, lr = 0.05, perturbation = 0.1 }

[[combos]]
ansatz = { type = "rvb" }
optimizer = { type = "adam", maxiter = 30, lr = 0.05, fd_eps = 0.1 }

[[combos]]
ansatz = { type = "hva" }
optimizer = { type = "spsa", maxiter = 50, lr = 0.05, perturbation = 0.1 }

[[combos]]
ansatz = { type = "hva" }
optimizer = { type = "adam", maxiter = 30, lr = 0.05, fd_eps = 0.1 }
