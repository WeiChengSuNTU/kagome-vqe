# Bit-flip companion of graph_hva_zne_fixed.toml: p = 2 sources (seeds 1-3), p_e = 1e-3 only.
#
#   uv run kagome-vqe zne-analysis configs/mitigation/graph_hva_zne_fixed_bitflip.toml
name = "graph_hva_zne_fixed_bitflip"
description = """
ZNE on fixed noise-free optima (PRB 105 2x6 rectangle, graph_hva OPG without H0; p = 2 seeds
1-3) under paper-layer bit-flip noise p_e = 1e-3. Methods:
probability scaling lambda = 1, 2, 3 (linear, Richardson, exponential) and lambda = 1, 2 (linear);
layer folding lambda = 1, 3 (linear) and 1, 3, 5 (Richardson, exponential). Standard errors for
1024 shots per basis and noise scale.
"""
runs = [
  "results/*-graph_hva_opt_repr/runs/*-graph_hva_opt_repr-bm2x6-p2-noh0-sv-lbfgsb-s[123]",
]
channels = ["bit_flip"]
probabilities = [1e-3]
shots = 1024
seed = 1

[[methods]]
label = "prob_lin_123"
noise_scaling = "probability"
scales = [1, 2, 3]
extrapolation = "linear"

[[methods]]
label = "prob_rich_123"
noise_scaling = "probability"
scales = [1, 2, 3]
extrapolation = "richardson"

[[methods]]
label = "prob_exp_123"
noise_scaling = "probability"
scales = [1, 2, 3]
extrapolation = "exponential"

[[methods]]
label = "prob_lin_12"
noise_scaling = "probability"
scales = [1, 2]
extrapolation = "linear"

[[methods]]
label = "fold_lin_13"
noise_scaling = "layer_folding"
scales = [1, 3]
extrapolation = "linear"

[[methods]]
label = "fold_rich_135"
noise_scaling = "layer_folding"
scales = [1, 3, 5]
extrapolation = "richardson"

[[methods]]
label = "fold_exp_135"
noise_scaling = "layer_folding"
scales = [1, 3, 5]
extrapolation = "exponential"
