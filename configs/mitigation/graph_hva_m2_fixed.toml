# The M2 mitigation table (docs/experiments/legacy_m0_m1_m2.md, main) redone for graph_hva on
# PRB 106 paper-layer noise. PRB 105 2x6 rectangle, graph_hva p = 2 (32 parameters), at the
# noise-free L-BFGS-B optimum (seed 1) and at a generic point (every parameter 0.3).
# Noise models, as M2's columns: gate noise only (depolarising p_e = 1e-3 on the PRB 106
# locations), readout error only (every measured bit flipped with q = 0.02; not part of
# PRB 106), and both. 1024 shots per basis; the twin is measured with 16384 shots per basis,
# the readout calibration with 2 x 16384 shots. Every repeat is a fresh setup.
#
#   uv run kagome-vqe mitigation-study configs/mitigation/graph_hva_m2_fixed.toml --dry-run
#   uv run kagome-vqe mitigation-study configs/mitigation/graph_hva_m2_fixed.toml --workers 4
name = "graph_hva_m2_fixed"
description = """
M2-style stack comparison for graph_hva p = 2 on the 2x6 rectangle under PRB 106 layer noise:
readout correction, symmetry (singlet-sector) filtering, ZNE (probability scaling or layer
folding, exponential fit), twin rescaling, alone and combined; 16 fresh-setup repeats, 1024
shots per basis.
"""
seed = 42
repeats = 16
lattice = { kind = "kagome_bm_rectangle", rows = 2, cols = 6 }
ansatz = { type = "graph_hva", reps = 2, schedule = "prb105" }

[[points]]
label = "opt"
run = "results/20261111T132627Z-graph_hva_opt_repr/runs/20261111T134019Z-graph_hva_opt_repr-bm2x6-p2-noh0-sv-lbfgsb-s1"

[[points]]
label = "generic0.3"
value = 0.3

[[noise]]
label = "gates"
backend = { kind = "logical_noise", shots = 1024, final_shots = 16384, logical_noise = { channel = "depolarizing", probability = 1e-3, fast_kernels = true } }

[[noise]]
label = "readout"
backend = { kind = "logical_noise", shots = 1024, final_shots = 16384, logical_noise = { channel = "depolarizing", probability = 0.0, readout_error = 0.02, fast_kernels = true } }

[[noise]]
label = "full"
backend = { kind = "logical_noise", shots = 1024, final_shots = 16384, logical_noise = { channel = "depolarizing", probability = 1e-3, readout_error = 0.02, fast_kernels = true } }

[[stacks]]
label = "none"

[[stacks]]
label = "readout"
mitigation = { readout = true }

[[stacks]]
label = "symmetry"
mitigation = { symmetry = true }

[[stacks]]
label = "readout+symmetry"
mitigation = { readout = true, symmetry = true }

[[stacks]]
label = "zne_prob"
mitigation = { zne = { scales = [1, 2, 3], extrapolation = "exponential", noise_scaling = "probability" } }

[[stacks]]
label = "zne_fold"
mitigation = { zne = { scales = [1, 3, 5], extrapolation = "exponential", noise_scaling = "layer_folding" } }

[[stacks]]
label = "readout+zne_prob"
mitigation = { readout = true, zne = { scales = [1, 2, 3], extrapolation = "exponential", noise_scaling = "probability" } }

[[stacks]]
label = "readout+symmetry+zne_prob"
mitigation = { readout = true, symmetry = true, zne = { scales = [1, 2, 3], extrapolation = "exponential", noise_scaling = "probability" } }

[[stacks]]
label = "twin"
mitigation = { rescale = { twin = "auto" } }

[[stacks]]
label = "readout+twin"
mitigation = { readout = true, rescale = { twin = "auto" } }

[[stacks]]
label = "symmetry+twin"
mitigation = { symmetry = true, rescale = { twin = "auto" } }

[[stacks]]
label = "readout+symmetry+twin"
mitigation = { readout = true, symmetry = true, rescale = { twin = "auto" } }
