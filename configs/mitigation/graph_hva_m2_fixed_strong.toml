# The M2 stack table of graph_hva_m2_fixed.toml at stronger gate noise: does any stack break
# (over-correct, or stop working) when the noise grows? PRB 105 2x6 rectangle, graph_hva p = 2,
# at the noise-free L-BFGS-B optimum only. Noise models: depolarising p_e = 3e-3 and 1e-2 on
# the PRB 106 locations, each alone ("gates") and with readout error q = 0.02 ("full").
# 1024 shots per basis; 16 fresh-setup repeats per cell. Infinite-shot limits of every stack:
# benchmarks/m2_exact_limits.py.
#
#   uv run kagome-vqe mitigation-study configs/mitigation/graph_hva_m2_fixed_strong.toml --dry-run
#   uv run kagome-vqe mitigation-study configs/mitigation/graph_hva_m2_fixed_strong.toml --workers 6
name = "graph_hva_m2_fixed_strong"
description = """
M2-style stack comparison for graph_hva p = 2 on the 2x6 rectangle at stronger PRB 106 layer
noise (depolarising 3e-3 and 1e-2, with and without readout error 0.02), at the noise-free
optimum; 16 fresh-setup repeats, 1024 shots per basis.
"""
seed = 42
repeats = 16
lattice = { kind = "kagome_bm_rectangle", rows = 2, cols = 6 }
ansatz = { type = "graph_hva", reps = 2, schedule = "prb105" }

[[points]]
label = "opt"
run = "results/20261111T132627Z-graph_hva_opt_repr/runs/20261111T134019Z-graph_hva_opt_repr-bm2x6-p2-noh0-sv-lbfgsb-s1"

[[noise]]
label = "gates_0.003"
backend = { kind = "logical_noise", shots = 1024, final_shots = 16384, logical_noise = { channel = "depolarizing", probability = 3e-3, fast_kernels = true } }

[[noise]]
label = "full_0.003"
backend = { kind = "logical_noise", shots = 1024, final_shots = 16384, logical_noise = { channel = "depolarizing", probability = 3e-3, readout_error = 0.02, fast_kernels = true } }

[[noise]]
label = "gates_0.01"
backend = { kind = "logical_noise", shots = 1024, final_shots = 16384, logical_noise = { channel = "depolarizing", probability = 1e-2, fast_kernels = true } }

[[noise]]
label = "full_0.01"
backend = { kind = "logical_noise", shots = 1024, final_shots = 16384, logical_noise = { channel = "depolarizing", probability = 1e-2, readout_error = 0.02, fast_kernels = true } }

[[stacks]]
label = "none"

[[stacks]]
label = "readout"
mitigation = { readout = true }

[[stacks]]
label = "symmetry"
mitigation = { symmetry = true }

[[stacks]]
label = "readout+symmetry"
mitigation = { readout = true, symmetry = true }

[[stacks]]
label = "zne_prob"
mitigation = { zne = { scales = [1, 2, 3], extrapolation = "exponential", noise_scaling = "probability" } }

[[stacks]]
label = "zne_fold"
mitigation = { zne = { scales = [1, 3, 5], extrapolation = "exponential", noise_scaling = "layer_folding" } }

[[stacks]]
label = "readout+zne_prob"
mitigation = { readout = true, zne = { scales = [1, 2, 3], extrapolation = "exponential", noise_scaling = "probability" } }

[[stacks]]
label = "readout+symmetry+zne_prob"
mitigation = { readout = true, symmetry = true, zne = { scales = [1, 2, 3], extrapolation = "exponential", noise_scaling = "probability" } }

[[stacks]]
label = "twin"
mitigation = { rescale = { twin = "auto" } }

[[stacks]]
label = "readout+twin"
mitigation = { readout = true, rescale = { twin = "auto" } }

[[stacks]]
label = "symmetry+twin"
mitigation = { symmetry = true, rescale = { twin = "auto" } }

[[stacks]]
label = "readout+symmetry+twin"
mitigation = { readout = true, symmetry = true, rescale = { twin = "auto" } }
