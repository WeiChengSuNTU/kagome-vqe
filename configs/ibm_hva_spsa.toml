# HVA + SPSA on real IBM Quantum hardware.
#
# Roadmap M1 recommends plain SPSA for HVA: with only 2 parameters it reached the most precise
# parameters at an equal shot budget, while parameter shift would cost 72 energies per step.
#
# Credentials come from the environment (see .env.example). Pick the device at the command line:
#   kagome-vqe run configs/ibm_hva_spsa.toml --set backend.name='"ibm_torino"'
# Rehearse the identical code path offline first:
#   kagome-vqe run configs/ibm_hva_spsa.toml --backend-override fake:FakeTorino
name = "ibm_hva_spsa"
seed = 42
x0_scale = 0.3           # start close to the dimer state; hardware time is expensive

[lattice]
site_order = "hamiltonian_cycle"

[ansatz]
type = "hva"
reps = 1

[optimizer]
type = "spsa"
maxiter = 50
lr = 0.05
perturbation = 0.1       # perturbation must exceed shot noise; 0.01 is far too small on hardware

[backend]
kind = "ibm"
name = "ibm_torino"
shots = 4096
final_shots = 16384     # one re-measurement of the final parameters (3 bases x 16384 shots)
resilience_level = 1     # TREX readout mitigation + twirling; 2 adds ZNE (slower)
optimization_level = 3
mode = "session"         # keeps the device reserved between iterations
max_time = "1h"
estimator_impl = "legacy_v2"
retries = 5
job_timeout_s = 3600
