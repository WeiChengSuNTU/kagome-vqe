# Limited representative optimiser comparison, executed during development (see
# docs/experiments/graph_hva_optimizers.md for its results). A subset of the full profile:
# p = 1, 2 without H0, three seeds, smaller budgets. About 25 minutes on 8 cores.
#
#   uv run kagome-vqe study configs/studies/graph_hva_optimizer_representative.toml
#   (interrupt any time; continue with --resume results/<timestamp>-graph_hva_opt_repr)
name = "graph_hva_opt_repr"
description = """
Limited comparison: PRB 105 2x6 rectangle (open), graph_hva without H0, p = 1 (16
parameters) and p = 2 (32), seeds 1-3. Experiment A: exact statevector, 3000 evaluations per
run. Experiment B: aer_ideal with 1024 shots per basis (sampling noise only), 4,608,000 shots
per run (1500 evaluations x 1024 x 3 bases) plus one 16384-shot re-measurement. Hyperparameters
from the seed-101 pilot (configs/studies/graph_hva_optimizer_pilot.toml).
"""
seeds = [1, 2, 3]
x0_scale = 0.1
reps = [1, 2]
include_h0 = [false]
success_threshold = 0.01

[ansatz]
type = "graph_hva"

[[lattices]]
label = "bm2x6"
lattice = { kind = "kagome_bm_rectangle", rows = 2, cols = 6 }
schedule = "prb105"

[[backends]]
label = "sv"
backend = { kind = "statevector" }
budget = { max_evaluations = 3000 }

[[backends]]
label = "shots1024"
backend = { kind = "aer_ideal", shots = 1024, final_shots = 16384 }
budget = { max_shots = 4608000 }

[[optimizers]]
label = "lbfgsb"
backends = ["sv"]
optimizer = { type = "scipy", method = "L-BFGS-B", maxiter = 100000, options = { maxfun = 1000000000 } }

[[optimizers]]
label = "spsa_cal"
fit_maxiter_to_budget = true
optimizer = { type = "spsa", calibrate = true, perturbation = 0.1, calibration_samples = 25, target_magnitude = 0.2 }

[[optimizers]]
label = "adam_spsa"
fit_maxiter_to_budget = true
optimizer = { type = "adam", gradient = "spsa", lr = 0.02, perturbation = 0.1 }
