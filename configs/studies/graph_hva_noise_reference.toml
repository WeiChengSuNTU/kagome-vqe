# Noise-free reference optima for the fixed-parameter noise analysis (PRB 106 methodology:
# optimise without noise, then evaluate the fixed parameters under noise). L-BFGS-B on the
# exact statevector, PRB 105 2x6 rectangle, no H0. p = 1 and 2 optima of seeds 1-3 already
# exist from the noise-free optimiser study (graph_hva_optimizer_representative.toml); this
# profile adds p = 3. During development only `--only s1` was executed (one run, ~3 minutes).
#
#   uv run kagome-vqe study configs/studies/graph_hva_noise_reference.toml --only s1
name = "graph_hva_noise_reference"
description = """
Noise-free L-BFGS-B optima, PRB 105 2x6 rectangle, graph_hva p = 3 without H0 (48 parameters),
10,000 statevector evaluations per run, as inputs to the fixed-parameter noise analysis.
"""
seeds = [1, 2, 3]
x0_scale = 0.1
reps = [3]
include_h0 = [false]
success_threshold = 0.01

[ansatz]
type = "graph_hva"

[[lattices]]
label = "bm2x6"
lattice = { kind = "kagome_bm_rectangle", rows = 2, cols = 6 }
schedule = "prb105"

[[backends]]
label = "sv"
backend = { kind = "statevector" }
budget = { max_evaluations = 10000 }

[[optimizers]]
label = "lbfgsb"
optimizer = { type = "scipy", method = "L-BFGS-B", maxiter = 100000, options = { maxfun = 1000000000 } }
