# Expressibility of per-layer parameter sharing (test B of docs/experiments/graph_hva_pidn_next.md).
# graph_hva with one angle per exchange layer and cycle (PRB 105 "per edge colour", the
# `per_layer` parameterisation: 5 layers of the prb105 schedule -> 5 p parameters) against the
# default one angle per gate (16 p). Noise-free L-BFGS-B on the exact statevector, same budget,
# seeds and x0 scale as the per-gate references (graph_hva_optimizer_representative p = 1, 2;
# graph_hva_noise_reference p = 3). p = 4 is extra: 20 shared parameters, still fewer than 32.
#
#   uv run kagome-vqe study configs/studies/graph_hva_per_layer_reference.toml --dry-run
name = "graph_hva_per_layer_reference"
description = """
Noise-free L-BFGS-B optima of graph_hva with per-layer sharing, PRB 105 2x6 rectangle, p = 2, 3, 4
(10, 15, 20 parameters), 10,000 statevector evaluations, seeds 1-3.
"""
seeds = [1, 2, 3]
x0_scale = 0.1
reps = [2, 3, 4]
include_h0 = [false]
success_threshold = 0.01

[ansatz]
type = "graph_hva"
parameterization = "per_layer"

[[lattices]]
label = "bm2x6"
lattice = { kind = "kagome_bm_rectangle", rows = 2, cols = 6 }
schedule = "prb105"

[[backends]]
label = "sv"
backend = { kind = "statevector" }
budget = { max_evaluations = 10000 }

[[optimizers]]
label = "lbfgsb"
optimizer = { type = "scipy", method = "L-BFGS-B", maxiter = 100000, options = { maxfun = 1000000000 } }
