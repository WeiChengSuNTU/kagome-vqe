# HVA design follow-up, stage 1 (planned for after the 2026-11 group meeting; not yet run).
# Question 1 of docs/research_overview.md: is p = 2, H0 off the right ansatz to carry through
# the noisy studies? The original baseline (graph_hva_baseline.toml) answers the noise-free
# side only with two seeds, no saved parameters and an evaluation cap that stopped p >= 3 and
# the p = 2 H0 runs. This profile repeats it on the PRB 105 2x6 rectangle at one equal budget
# with three seeds and saved parameters, so that stage 2
# (configs/noise/graph_hva_design_fixed_noise.toml) can evaluate every (p, H0) optimum under
# the same noise.
#
#   uv run kagome-vqe study configs/studies/graph_hva_design_reference.toml --dry-run
#   uv run kagome-vqe study configs/studies/graph_hva_design_reference.toml --only p2- --no-summary
#   (one process per p, then) uv run kagome-vqe study-summary results/<ts>-graph_hva_design_reference
name = "graph_hva_design_reference"
description = """
Noise-free L-BFGS-B optima of graph_hva on the PRB 105 2x6 rectangle for p = 1-4 with and
without H0, seeds 1-3, 10,000 statevector evaluations each (equal budget), parameters saved.
"""
seeds = [1, 2, 3]
x0_scale = 0.1
reps = [1, 2, 3, 4]
include_h0 = [false, true]
success_threshold = 0.01

[ansatz]
type = "graph_hva"

[[lattices]]
label = "bm2x6"
lattice = { kind = "kagome_bm_rectangle", rows = 2, cols = 6 }
schedule = "prb105"

[[backends]]
label = "sv"
backend = { kind = "statevector" }
budget = { max_evaluations = 10000 }

[[optimizers]]
label = "lbfgsb"
optimizer = { type = "scipy", method = "L-BFGS-B", maxiter = 100000, options = { maxfun = 1000000000 } }
