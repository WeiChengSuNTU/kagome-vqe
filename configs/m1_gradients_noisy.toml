# Roadmap M1: which gradient gives the most precision per shot?
#
# Every combo spends the same 24576 shots per measurement basis per iteration, split evenly over
# the energies its gradient needs (shots = 24576 / energies per gradient). All gradient methods
# share the same update rule, ADAM with lr = 0.05, so differences come from the gradients alone;
# plain SPSA with its own update rule is the baseline. The metric is the noise-free energy of
# the parameters reached (ideal_trace.csv, ideal_vs_shots.png), not the noisy measured energy.
# This config adds FakeGuadalupeV2 noise. Noisy evaluation costs ~2.5 s per energy whatever
# the shot count, so only RVB is run (HVA parameter shift needs 72 energies per iteration) and
# with one seed: it checks that the ranking from m1_gradients_ideal.toml survives noise.
name = "m1_noisy"
seed = 1
x0_scale = 0.7853981633974483
record_params = false
track_ideal_energy = true

[backend]
kind = "aer_noisy"
name = "FakeGuadalupeV2"
shots = 4096
final_shots = 16384
optimization_level = 3
initial_layout = [1, 2, 3, 5, 8, 11, 14, 13, 12, 10, 7, 4]

[[combos]]
ansatz = { type = "rvb" }
label = "rvb_adam_forward"
optimizer = { type = "adam", maxiter = 20, lr = 0.05, gradient = "forward", fd_eps = 0.1 }
shots = 1890   # 13 energies per gradient

[[combos]]
ansatz = { type = "rvb" }
optimizer = { type = "adam", maxiter = 20, lr = 0.05, gradient = "spsa", perturbation = 0.1 }
shots = 12288   # 2 energies per gradient

[[combos]]
ansatz = { type = "rvb" }
optimizer = { type = "adam", maxiter = 20, lr = 0.05, gradient = "parameter_shift" }
shots = 1024   # 24 energies per gradient

[[combos]]
ansatz = { type = "rvb" }
optimizer = { type = "spsa", maxiter = 20, lr = 0.01, perturbation = 0.1 }
shots = 12288   # plain SPSA baseline, 2 energies per step
